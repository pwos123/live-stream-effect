<!doctype html><meta charset="utf-8"><title>特效测试台</title><style>body{font-family:system-ui,"Microsoft YaHei";max-width:760px;margin:40px auto}button,input,select{font-size:18px;margin:8px;padding:8px}</style><h1>直播特效测试台</h1><p>打开 overlay.html 到 OBS/抖音直播伴侣浏览器源后，可在这里模拟事件。</p><select id=t><option value=enter>进房</option><option value=like>点赞</option><option value=comment>评论</option><option value=gift>礼物</option></select><input id=u value="测试观众"><input id=x value="666 / 小心心"><button onclick="send()">触发</button><script>async function send(){await fetch('/api/event',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({type:t.value,user:u.value,text:x.value,giftName:x.value,count:t.value==='like'?8:1})})}</script>
