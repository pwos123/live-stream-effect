<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><title>抖音无 CDK 弹幕 OCR 监听器</title><style>body{font-family:system-ui,"Microsoft YaHei";max-width:980px;margin:24px auto;line-height:1.6}button{font-size:18px;padding:10px 16px}video,canvas{max-width:46%;border:1px solid #ddd;margin:8px}.log{height:220px;overflow:auto;background:#111;color:#0f0;padding:10px;white-space:pre-wrap}</style></head><body><h1>抖音无 CDK 弹幕 OCR 监听器</h1><p>方案：不调用抖音 CDK/非公开接口，只识别你电脑上“抖音直播伴侣/直播管理页”的可见互动消息文字，再把识别到的进房、点赞、评论、礼物事件推送到本地 Overlay。</p><ol><li>先打开抖音直播伴侣或直播管理页，并让互动消息区域保持可见。</li><li>点击“开始屏幕识别”，选择包含互动消息的窗口或屏幕。</li><li>建议只共享消息区域所在窗口；浏览器会每 2.5 秒 OCR 一次。</li></ol><button id=start>开始屏幕识别</button><button id=stop disabled>停止</button><br><video id=video autoplay muted></video><canvas id=frame></canvas><div class=log id=log></div><script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script><script src="monitor.js"></script></body></html>
