<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>直播特效 Overlay</title><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:system-ui,"Microsoft YaHei",sans-serif}#stage{position:fixed;inset:0}#status{position:fixed;left:12px;bottom:10px;color:rgba(255,255,255,.55);font-size:12px;text-shadow:0 1px 2px #000}.card{position:absolute;left:50%;top:18%;transform:translate(-50%,-50%);padding:18px 28px;border-radius:24px;color:white;font-size:34px;font-weight:800;text-shadow:0 3px 8px #000;background:linear-gradient(135deg,rgba(255,85,160,.9),rgba(90,120,255,.85));box-shadow:0 0 35px rgba(255,255,255,.5);animation:pop 2.8s ease forwards;white-space:nowrap}.comment{top:72%;font-size:26px;background:rgba(0,0,0,.48)}@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-90%) scale(.9)}}
